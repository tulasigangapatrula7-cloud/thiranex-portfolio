<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tulasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Tulasi<span>.</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="page-container">
    <p class="greeting">LET'S CONNECT</p>
    <h1 class="page-title">Contact <span>Me</span></h1>

    <section class="contact-layout">
        <div class="contact-info">
            <h2>Get in Touch</h2>
            <p>Have a project idea or want to connect? Send me a message.</p>

            <p class="contact-item">
                Email:
                <a href="mailto:tulasigangapatrula7@gmail.com">
                    tulasigangapatrula7@gmail.com
                </a>
            </p>

            <p class="contact-item">
                <a href="https://github.com/tulasigangapatrula7-cloud" target="_blank" rel="noopener noreferrer">Visit GitHub ↗</a>
            </p>

            <p class="contact-item">
                <a href="https://www.linkedin.com/in/tulasi-gangapatrula-50a39b38b" target="_blank" rel="noopener noreferrer">Visit LinkedIn ↗</a>
            </p>
        </div>

        <form id="contactForm" class="contact-form">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="btn">Send Message</button>
            <p id="formStatus" role="status"></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Tulasi. Built with passion and code.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
